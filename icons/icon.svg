<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 米色底：溫潤的紙感，不用漸層避免搶走主體 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee2"/>
      <stop offset="1" stop-color="#e8dfcf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 實驗桌：黑白線稿，米色底 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- 桌面厚板 -->
    <rect x="58" y="242" width="396" height="28" rx="6" fill="#1a1a1a" stroke="none"/>
    <!-- 前緣裙板 -->
    <path d="M86 270 V292 H426 V270"/>
    <!-- 桌腳 -->
    <path d="M112 292 V398"/>
    <path d="M400 292 V398"/>
    <!-- 下層置物板 -->
    <path d="M112 342 H400"/>
    <!-- 置物板上的三支試管 -->
    <path d="M230 342 V318"/>
    <path d="M256 342 V306"/>
    <path d="M282 342 V322"/>
  </g>
  <!-- 桌上錐形瓶（線稿＋底部液體） -->
  <g fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 242 V186 L168 242"/>
    <path d="M232 242 V186"/>
    <path d="M190 186 H220"/>
  </g>
  <path d="M180 220 H220 L230 242 H170 Z" fill="#1a1a1a"/>
  <!-- 桌上燒杯（線稿＋液體） -->
  <g fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 242 V200 H348 V242"/>
    <path d="M348 212 H366"/>
  </g>
  <path d="M308 218 H340 V242 H308 Z" fill="#1a1a1a"/>
  <!-- 燒杯液面高光：白線，在黑液體上拉出層次 -->
  <path d="M310 218 H338" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
